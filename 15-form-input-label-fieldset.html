<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Personal Details Form</title></head>
<body>
<form>
    <fieldset><legend>Personal Details</legend>
        <p><label for="name">Name:</label> <input id="name" name="name" type="text"></p>
        <p><label for="email">Email:</label> <input id="email" name="email" type="email"></p>
        <p><label for="password">Password:</label> <input id="password" name="password" type="password"></p>
        <p>Gender: <label><input type="radio" name="gender" value="male">Male</label> <label><input type="radio" name="gender" value="female">Female</label></p>
        <p>Hobbies: <label><input type="checkbox" name="hobby" value="reading">Reading</label> <label><input type="checkbox" name="hobby" value="coding">Coding</label></p>
        <p><label for="dob">DOB:</label> <input id="dob" name="dob" type="date"></p>
    </fieldset>
</form>
</body>
</html>
