<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Block and Inline Elements</title>
<style>
.block { display:block; background:lightblue; margin:5px 0; padding:5px; }
.inline { display:inline; background:lightgreen; padding:3px; }
</style></head>
<body>
    <div class="block">Block 1</div>
    <div class="block">Block 2</div>
    <span class="inline">Inline 1</span>
    <span class="inline">Inline 2</span>
    <span class="inline">Inline 3</span>
</body>
</html>
