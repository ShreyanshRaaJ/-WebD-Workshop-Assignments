<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABES ENGINEERING COLLEGE Admission 2026</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f4f5fb;color:#222}
header,footer{background:#202879;color:white;text-align:center;padding:18px}
main{max-width:650px;margin:25px auto;padding:20px;background:white}
table{width:100%;border-collapse:collapse;margin-bottom:22px}
th,td{border:1px solid #aaa;padding:9px;text-align:left}
th{background:#e8e9f4}fieldset{padding:15px}label{display:block;margin:12px 0 5px}
input,select,textarea{width:100%;padding:8px;max-width:100%}
button{margin-top:15px;padding:9px 18px;cursor:pointer}
</style>
</head>
<body>
<header><h1>ABES ENGINEERING COLLEGE Admission 2026</h1></header>
<main>
    <section aria-labelledby="courses-heading">
        <h2 id="courses-heading">Courses and Fees</h2>
        <table>
            <caption>Available Courses</caption>
            <thead><tr><th scope="col">Course</th><th scope="col">Seats</th><th scope="col">Fees</th></tr></thead>
            <tbody>
                <tr><td>B.Tech CSE</td><td>120</td><td>₹90,000</td></tr>
                <tr><td>BCA</td><td>60</td><td>₹45,000</td></tr>
            </tbody>
        </table>
    </section>
    <form action="#" method="post">
        <fieldset><legend>Application Form</legend>
            <label for="student-name">Name:</label><input id="student-name" name="name" type="text" required>
            <label for="student-email">Email:</label><input id="student-email" name="email" type="email" required>
            <label for="student-course">Course:</label>
            <select id="student-course" name="course"><option>B.Tech CSE</option><option>BCA</option></select>
            <label for="statement">Statement:</label><textarea id="statement" name="statement" rows="4"></textarea>
            <button type="submit">Apply</button>
        </fieldset>
    </form>
</main>
<footer>&copy; 2026 ABES ENGINEERING COLLEGE</footer>
</body>
</html>
