<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Select and Textarea</title></head>
<body>
<form>
    <p><label for="course">Course:</label>
    <select id="course" name="course"><option>ECE</option><option>CSE</option><option>IT</option><option>Mechanical</option></select></p>
    <p><label for="feedback">Feedback:</label><br><textarea id="feedback" name="feedback" rows="5" cols="30" placeholder="Write here..."></textarea></p>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    <button type="button" onclick="alert('Button clicked!')">Click Me</button>
</form>
</body>
</html>
